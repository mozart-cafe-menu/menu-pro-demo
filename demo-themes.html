<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie des Thèmes | GeNext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0c0a08; --bg2: #111009; --card: rgba(255,255,255,0.04);
      --cream: #f0ead8; --muted: rgba(240,234,216,0.52);
      --gold: #c8a44e; --gold-lt: #dfc27a;
      --border: rgba(200,164,78,0.16); --border2: rgba(200,164,78,0.34);
      --nav-h: 56px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--cream); font-family: 'Outfit', system-ui, sans-serif; overflow: hidden; }

    /* ── TOP BAR ── */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h); display: flex; align-items: center; padding: 0 18px; gap: 14px;
      background: rgba(12,10,8,0.98); border-bottom: 1px solid var(--border);
    }
    .top-bar-title {
      font-family: 'Cormorant', serif; font-size: 1.1rem; font-weight: 600;
      color: var(--cream); flex: 1; letter-spacing: 0.04em;
    }
    .top-bar-title em { font-style: italic; color: var(--gold); }
    .demo-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px; border-radius: 20px;
      background: rgba(200,164,78,0.12); border: 1px solid rgba(200,164,78,0.3);
      font-size: 0.68rem; letter-spacing: 0.08em; color: var(--gold); font-weight: 500;
    }
    .demo-badge::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .top-back {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 11px; border-radius: 20px; font-size: 0.75rem; font-weight: 500;
      text-decoration: none; letter-spacing: 0.04em; transition: all 0.2s;
      border: 1px solid var(--border2); color: var(--muted); background: transparent;
    }
    .top-back:hover { border-color: var(--gold); color: var(--cream); background: rgba(200,164,78,0.08); }

    /* ── LAYOUT ── */
    .layout {
      display: flex; height: 100svh; padding-top: var(--nav-h);
    }

    /* ── SIDEBAR (desktop) ── */
    .sidebar {
      width: 260px; flex-shrink: 0; overflow-y: auto;
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      scrollbar-width: thin; scrollbar-color: rgba(200,164,78,0.2) transparent;
    }
    .sidebar-label {
      font-size: 0.68rem; letter-spacing: 0.12em; color: var(--muted);
      padding: 6px 8px 10px; text-transform: uppercase;
    }

    /* ── THEME CARDS ── */
    .theme-card {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 10px; border-radius: 12px; cursor: pointer;
      transition: all 0.2s; border: 1px solid transparent; margin-bottom: 4px;
    }
    .theme-card:hover { background: var(--card); border-color: var(--border); }
    .theme-card.active { background: rgba(200,164,78,0.08); border-color: rgba(200,164,78,0.4); }
    .theme-swatch {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .theme-swatch-inner {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    }
    .theme-name { font-size: 0.82rem; font-weight: 500; color: var(--cream); }
    .theme-family { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }
    .theme-card.active .theme-name { color: var(--gold-lt); }

    /* ── MOBILE STRIP ── */
    .mobile-strip {
      display: none;
      position: fixed; top: var(--nav-h); left: 0; right: 0; z-index: 100;
      overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      padding: 10px 14px; gap: 8px;
      background: rgba(12,10,8,0.96); border-bottom: 1px solid var(--border);
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .mobile-strip::-webkit-scrollbar { display: none; }
    .mobile-strip { display: none; }
    .mobile-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 12px; border-radius: 20px; cursor: pointer;
      border: 1px solid var(--border); font-size: 0.75rem; font-weight: 500;
      color: var(--muted); background: transparent; transition: all 0.2s; white-space: nowrap;
      font-family: inherit;
    }
    .mobile-pill.active { background: rgba(200,164,78,0.1); border-color: rgba(200,164,78,0.4); color: var(--gold-lt); }
    .mobile-pill-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── PREVIEW ── */
    .preview { flex: 1; overflow: hidden; position: relative; }
    .preview-frame { width: 100%; height: 100%; border: none; display: block; }

    /* ── LOADING ── */
    .preview-loader {
      position: absolute; inset: 0; background: var(--bg2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; transition: opacity 0.4s;
    }
    .preview-loader.hidden { opacity: 0; pointer-events: none; }
    .loader-ring {
      width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid rgba(200,164,78,0.2);
      border-top-color: var(--gold);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 0.82rem; color: var(--muted); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .mobile-strip { display: flex; }
      .preview { padding-top: 54px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-bar-title">Galerie des <em>thèmes</em></div>
    <span class="demo-badge">DÉMO</span>
    <a href="index.html" class="top-back">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Retour
    </a>
  </div>

  <!-- MOBILE STRIP -->
  <div class="mobile-strip" id="mobile-strip"></div>

  <!-- LAYOUT -->
  <div class="layout">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-label">Choisir un thème</div>
      <!-- cards injected by JS -->
    </div>

    <!-- PREVIEW -->
    <div class="preview">
      <div class="preview-loader" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Chargement du thème…</div>
      </div>
      <iframe class="preview-frame" id="preview-frame" src="" title="Prévisualisation du thème" allow="fullscreen"></iframe>
    </div>
  </div>

<script>
'use strict';

const THEMES = [
  { id:'gold-noir',       name:'Gold Noir',        family:'Classique',  bg:'#0c0a08', accent:'#c8a44e' },
  { id:'prestige',        name:'Prestige',          family:'Classique',  bg:'#0c0a08', accent:'#c8a44e' },
  { id:'velvet-luxe',     name:'Velvet Luxe',       family:'Classique',  bg:'#0d0006', accent:'#d4af37' },
  { id:'midnight-luxe',   name:'Enseigne',          family:'Classique',  bg:'#03041a', accent:'#f0d060' },
  { id:'neon-tokyo',      name:'Neon Pulse',        family:'Moderne',    bg:'#030010', accent:'#00f5d4' },
  { id:'midnight',        name:'Minuit Violet',     family:'Moderne',    bg:'#0b0914', accent:'#a67cff' },
  { id:'botanical',       name:'Botanical Forest',  family:'Nature',     bg:'#060e06', accent:'#7acc5a' },
  { id:'forest',          name:'Forest',            family:'Nature',     bg:'#09120c', accent:'#5ebd85' },
  { id:'rose-parisien',   name:'Rose Parisien',     family:'Romantique', bg:'#140a0e', accent:'#e890b0' },
  { id:'santorin',        name:'Santorin',          family:'Méditerranée',bg:'#04090f', accent:'#4db8ff' },
];

const EVENTS = [
  { id:'none',      name:'Aucun événement', icon:'—' },
  { id:'christmas', name:'Noël',            icon:'🎄' },
  { id:'new-year',  name:'Nouvel An',       icon:'🥂' },
  { id:'easter',    name:'Pâques',          icon:'🌸' },
  { id:'summer',    name:'Été',             icon:'☀️' },
  { id:'halloween', name:'Halloween',       icon:'🎃' },
];

const BASE_URL = 'menu-demo.html?demo_style=simple&demo_bell=0&demo_order=0&demo_theme=';

let activeTheme = (new URLSearchParams(location.search).get('theme')) || 'gold-noir';
if (!THEMES.some(t => t.id === activeTheme)) activeTheme = 'gold-noir';
let activeEvent = 'none';
let _iframeLoaded = false;

function getIframe() { return document.getElementById('preview-frame'); }

function postToMenu(msg) {
  const iframe = getIframe();
  if (iframe && iframe.contentWindow) {
    iframe.contentWindow.postMessage(msg, '*');
  }
}

function buildSwatch(theme) {
  return `<div class="theme-swatch" style="background:${theme.bg};">
    <div class="theme-swatch-inner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="7" fill="${theme.accent}" opacity="0.85"/>
      </svg>
    </div>
  </div>`;
}

function selectTheme(id) {
  activeTheme = id;

  // Update sidebar
  document.querySelectorAll('.theme-card').forEach(c => c.classList.toggle('active', c.dataset.themeId === id));
  // Update mobile strip
  document.querySelectorAll('.mobile-pill[data-theme-id]').forEach(p => p.classList.toggle('active', p.dataset.themeId === id));

  if (_iframeLoaded) {
    // Live update via postMessage — no reload
    postToMenu({ type: 'set-theme', theme: id });
  } else {
    // First load — use URL
    const loader = document.getElementById('loader');
    const iframe = getIframe();
    loader.classList.remove('hidden');
    iframe.onload = () => {
      _iframeLoaded = true;
      // Re-apply event if any
      if (activeEvent !== 'none') postToMenu({ type: 'set-event', event: activeEvent });
      setTimeout(() => loader.classList.add('hidden'), 400);
    };
    iframe.src = BASE_URL + id;
  }
}

function selectEvent(id) {
  activeEvent = id;
  // Update event pills
  document.querySelectorAll('.event-pill').forEach(p => p.classList.toggle('active', p.dataset.eventId === id));
  postToMenu({ type: 'set-event', event: id });
}

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  // Group themes by family
  const families = {};
  THEMES.forEach(t => {
    if (!families[t.family]) families[t.family] = [];
    families[t.family].push(t);
  });

  let html = '';
  Object.entries(families).forEach(([family, themes]) => {
    html += `<div class="sidebar-label" style="margin-top:10px">${family}</div>`;
    themes.forEach(t => {
      html += `<div class="theme-card${t.id === activeTheme ? ' active' : ''}" data-theme-id="${t.id}" onclick="selectTheme('${t.id}')">
        ${buildSwatch(t)}
        <div>
          <div class="theme-name">${t.name}</div>
        </div>
      </div>`;
    });
  });

  // Events section
  html += `<div class="sidebar-label" style="margin-top:18px;border-top:1px solid rgba(200,164,78,0.12);padding-top:14px">Événements</div>`;
  EVENTS.forEach(ev => {
    html += `<div class="theme-card${ev.id === activeEvent ? ' active' : ''} event-pill" data-event-id="${ev.id}" onclick="selectEvent('${ev.id}')">
      <div class="theme-swatch" style="background:rgba(200,164,78,0.06);font-size:1.1rem;display:flex;align-items:center;justify-content:center">${ev.icon}</div>
      <div>
        <div class="theme-name">${ev.name}</div>
      </div>
    </div>`;
  });

  sidebar.innerHTML = html;
}

function buildMobileStrip() {
  const strip = document.getElementById('mobile-strip');
  const themesPills = THEMES.map(t => `
    <button class="mobile-pill${t.id === activeTheme ? ' active' : ''}" data-theme-id="${t.id}" onclick="selectTheme('${t.id}')">
      <span class="mobile-pill-dot" style="background:${t.accent}"></span>
      ${t.name}
    </button>
  `).join('');

  const sep = `<span style="display:inline-flex;align-items:center;padding:0 6px;color:rgba(240,234,216,0.3);font-size:.7rem">|</span>`;

  const eventsPills = EVENTS.map(ev => `
    <button class="mobile-pill event-pill${ev.id === activeEvent ? ' active' : ''}" data-event-id="${ev.id}" onclick="selectEvent('${ev.id}')">
      ${ev.icon} ${ev.name}
    </button>
  `).join('');

  strip.innerHTML = themesPills + sep + eventsPills;
}

function init() {
  buildSidebar();
  buildMobileStrip();
  selectTheme(activeTheme);
}

init();
</script>
</body>
</html>
