<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a08">
  <title>App Serveur — Démo | GeNext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0c0a08; --bg2: #161210; --card: rgba(255,255,255,0.04);
      --cream: #f0ead8; --muted: rgba(240,234,216,0.52);
      --gold: #c8a44e; --gold-lt: #dfc27a;
      --border: rgba(200,164,78,0.18); --border2: rgba(200,164,78,0.34);
      --green: #7ebd6a; --orange: #e8854a; --red: #e84a4a;
      --r: 16px; --nav-h: 60px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    html, body { height: 100%; background: var(--bg); color: var(--cream); font-family: 'Outfit', system-ui, sans-serif; }

    /* ── NAV TOP ── */
    .app-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--nav-h); display: flex; align-items: center; padding: 0 18px;
      background: rgba(12,10,8,0.96); border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .app-nav-logo {
      font-family: 'Cormorant', serif; font-size: 1.15rem; font-weight: 600;
      color: var(--cream); letter-spacing: 0.04em; flex: 1;
    }
    .app-nav-logo span { color: var(--gold); }
    .demo-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px; border-radius: 20px;
      background: rgba(200,164,78,0.12); border: 1px solid rgba(200,164,78,0.3);
      font-size: 0.68rem; letter-spacing: 0.08em; color: var(--gold); font-weight: 500;
    }
    .demo-badge::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── TAB BAR ── */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: calc(60px + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(12,10,8,0.96); border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      display: flex; align-items: stretch;
    }
    .tab-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.65rem; font-family: inherit; letter-spacing: 0.05em;
      padding-top: 8px; transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: var(--gold); }
    .tab-btn svg { width: 22px; height: 22px; stroke-width: 1.5; }

    /* ── MAIN ── */
    .main {
      padding-top: var(--nav-h); padding-bottom: calc(60px + var(--safe-b) + 16px);
      min-height: 100svh;
    }
    .panel { display: none; padding: 18px 16px; }
    .panel.active { display: block; }

    /* ── SECTION TITLE ── */
    .sec-title {
      font-family: 'Cormorant', serif; font-size: 1.3rem; font-weight: 600;
      color: var(--cream); letter-spacing: 0.04em; margin-bottom: 14px;
    }

    /* ── CALL CARD ── */
    .call-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 10px; animation: slideIn 0.4s ease;
    }
    @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .call-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(200,164,78,0.12); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .call-icon svg { width: 20px; height: 20px; color: var(--gold); }
    .call-info { flex: 1; }
    .call-table { font-family: 'Cormorant', serif; font-size: 1.05rem; font-weight: 600; color: var(--cream); }
    .call-time { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .call-done {
      background: none; border: 1px solid var(--border2); border-radius: 10px;
      color: var(--gold); padding: 6px 12px; font-size: 0.75rem; font-family: inherit;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .call-done:hover { background: rgba(200,164,78,0.1); }

    /* ── ORDER CARD ── */
    .order-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); margin-bottom: 12px; overflow: hidden;
      animation: slideIn 0.4s ease;
    }
    .order-hd {
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
      cursor: pointer; user-select: none;
    }
    .order-table { font-family: 'Cormorant', serif; font-size: 1.1rem; font-weight: 600; color: var(--cream); }
    .order-meta { flex: 1; display: flex; flex-direction: column; }
    .order-time { font-size: 0.68rem; color: var(--muted); }
    .order-total { font-size: 0.8rem; color: var(--gold); font-weight: 500; }
    .order-status {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 20px; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.04em;
    }
    .order-status.pending { background: rgba(232,133,74,0.14); color: var(--orange); border: 1px solid rgba(232,133,74,0.3); }
    .order-status.done { background: rgba(126,189,106,0.14); color: var(--green); border: 1px solid rgba(126,189,106,0.3); }
    .order-body { border-top: 1px solid var(--border); padding: 12px 16px; }
    .order-item { display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.82rem; }
    .order-item-name { color: var(--cream); }
    .order-item-price { color: var(--muted); }
    .order-actions { display: flex; gap: 8px; margin-top: 12px; }
    .order-btn {
      flex: 1; padding: 9px 12px; border-radius: 10px; font-size: 0.78rem;
      font-family: inherit; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none;
    }
    .order-btn.accept { background: rgba(126,189,106,0.15); color: var(--green); border: 1px solid rgba(126,189,106,0.3); }
    .order-btn.accept:hover { background: rgba(126,189,106,0.25); }
    .order-btn.decline { background: rgba(232,74,74,0.1); color: var(--red); border: 1px solid rgba(232,74,74,0.2); }
    .order-btn.decline:hover { background: rgba(232,74,74,0.2); }

    /* ── MESSAGES PANEL ── */
    .msg-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px;
      animation: slideIn 0.4s ease;
    }
    .msg-from { font-size: 0.72rem; color: var(--gold); font-weight: 500; margin-bottom: 4px; }
    .msg-text { font-size: 0.88rem; color: var(--cream); line-height: 1.5; }
    .msg-time { font-size: 0.68rem; color: var(--muted); margin-top: 6px; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 56px 24px;
      color: var(--muted); font-size: 0.88rem; line-height: 1.7;
    }
    .empty-state svg { width: 40px; height: 40px; color: rgba(200,164,78,0.2); margin-bottom: 14px; }

    /* ── NOTIF HINT ── */
    .notif-hint {
      margin: 0 0 16px; padding: 12px 14px; border-radius: 14px;
      background: rgba(200,164,78,0.06); border: 1px solid rgba(200,164,78,0.2);
      font-size: 0.8rem; color: var(--muted); line-height: 1.5;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .notif-hint svg { flex-shrink: 0; margin-top: 1px; color: var(--gold); }
    .notif-hint strong { color: var(--cream); }
  </style>
</head>
<body>

  <!-- NAV -->
  <div class="app-nav">
    <div class="app-nav-logo">Menu<span>Pro</span> · Serveur</div>
    <span class="demo-badge">DÉMO</span>
  </div>

  <!-- PANELS -->
  <div class="main">

    <!-- CALLS -->
    <div class="panel" id="panel-calls">
      <p class="sec-title">Appels en attente</p>
      <div class="notif-hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <div>En situation réelle, chaque appel génère aussi une <strong>notification push</strong> sur votre téléphone, même si l'app est fermée.</div>
      </div>
      <div id="calls-list"></div>
    </div>

    <!-- ORDERS -->
    <div class="panel" id="panel-orders">
      <p class="sec-title">Commandes reçues</p>
      <div class="notif-hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <div>En situation réelle, chaque commande génère une <strong>notification push</strong> instantanée et apparaît ici en temps réel.</div>
      </div>
      <div id="orders-list"></div>
    </div>

    <!-- MESSAGES -->
    <div class="panel" id="panel-messages">
      <p class="sec-title">Messages</p>
      <div id="messages-list"></div>
    </div>

  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <button class="tab-btn" id="tab-calls" onclick="switchTab('calls')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
      Appels
    </button>
    <button class="tab-btn" id="tab-orders" onclick="switchTab('orders')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      Commandes
    </button>
    <button class="tab-btn" id="tab-messages" onclick="switchTab('messages')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Messages
    </button>
  </div>

<script>
'use strict';

/* ── MOCK DATA ── */
const MOCK_CALLS = [
  { id:1, table:'Table 4', time:'Il y a 2 min' },
  { id:2, table:'Table 7', time:'Il y a 5 min' },
  { id:3, table:'Table 12', time:'Il y a 9 min' },
];

const MOCK_ORDERS = [
  {
    id:1, table:'Table 3', time:'Il y a 1 min', total:'38,50 €', status:'pending',
    items:[
      {name:'Salade grecque', price:'8,50 €'},
      {name:'Brochette d\'agneau (×2)', price:'22,00 €'},
      {name:'Baklava', price:'5,00 €'},
      {name:'Eau minérale', price:'3,00 €'},
    ]
  },
  {
    id:2, table:'Table 9', time:'Il y a 8 min', total:'24,00 €', status:'done',
    items:[
      {name:'Tzatzíki', price:'6,00 €'},
      {name:'Moussaka', price:'14,00 €'},
      {name:'Café grec', price:'4,00 €'},
    ]
  },
];

const MOCK_MESSAGES = [
  { from:'Table 5', text:'Allergie aux noix — merci de prévenir la cuisine.', time:'Il y a 3 min' },
  { from:'Table 2', text:'Bon anniversaire pour la personne à la table 2 ! Pouvez-vous apporter un dessert surprise ?', time:'Il y a 12 min' },
];

/* ── TAB LOGIC ── */
let currentTab = 'calls';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

/* ── RENDER CALLS ── */
function renderCalls() {
  const list = document.getElementById('calls-list');
  if (!MOCK_CALLS.length) {
    list.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
      <div>Aucun appel en attente</div>
    </div>`;
    return;
  }
  list.innerHTML = MOCK_CALLS.map(c => `
    <div class="call-card" id="call-${c.id}">
      <div class="call-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
      </div>
      <div class="call-info">
        <div class="call-table">${c.table}</div>
        <div class="call-time">${c.time}</div>
      </div>
      <button class="call-done" onclick="dismissCall(${c.id})">Traité</button>
    </div>
  `).join('');
}

function dismissCall(id) {
  const el = document.getElementById('call-' + id);
  if (el) { el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='all 0.3s'; setTimeout(() => el.remove(), 300); }
  const idx = MOCK_CALLS.findIndex(c => c.id === id);
  if (idx !== -1) MOCK_CALLS.splice(idx, 1);
}

/* ── RENDER ORDERS ── */
function renderOrders() {
  const list = document.getElementById('orders-list');
  if (!MOCK_ORDERS.length) {
    list.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <div>Aucune commande reçue</div>
    </div>`;
    return;
  }
  list.innerHTML = MOCK_ORDERS.map(o => `
    <div class="order-card" id="order-${o.id}">
      <div class="order-hd" onclick="toggleOrder(${o.id})">
        <div class="order-meta">
          <div class="order-table">${o.table}</div>
          <div class="order-time">${o.time}</div>
          <div class="order-total">${o.total}</div>
        </div>
        <span class="order-status ${o.status}">${o.status === 'pending' ? 'En attente' : 'Terminé'}</span>
      </div>
      <div class="order-body" id="order-body-${o.id}" style="display:none">
        ${o.items.map(it => `<div class="order-item"><span class="order-item-name">${it.name}</span><span class="order-item-price">${it.price}</span></div>`).join('')}
        ${o.status === 'pending' ? `<div class="order-actions">
          <button class="order-btn accept" onclick="acceptOrder(${o.id})">Accepter</button>
          <button class="order-btn decline" onclick="declineOrder(${o.id})">Refuser</button>
        </div>` : ''}
      </div>
    </div>
  `).join('');
}

function toggleOrder(id) {
  const body = document.getElementById('order-body-' + id);
  if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

function acceptOrder(id) {
  const o = MOCK_ORDERS.find(x => x.id === id);
  if (o) { o.status = 'done'; renderOrders(); }
}

function declineOrder(id) {
  const el = document.getElementById('order-' + id);
  if (el) { el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='all 0.3s'; setTimeout(() => el.remove(), 300); }
  const idx = MOCK_ORDERS.findIndex(x => x.id === id);
  if (idx !== -1) MOCK_ORDERS.splice(idx, 1);
}

/* ── RENDER MESSAGES ── */
function renderMessages() {
  const list = document.getElementById('messages-list');
  if (!MOCK_MESSAGES.length) {
    list.innerHTML = `<div class="empty-state"><div>Aucun message</div></div>`;
    return;
  }
  list.innerHTML = MOCK_MESSAGES.map(m => `
    <div class="msg-card">
      <div class="msg-from">${m.from}</div>
      <div class="msg-text">${m.text}</div>
      <div class="msg-time">${m.time}</div>
    </div>
  `).join('');
}

/* ── INIT ── */
function init() {
  renderCalls();
  renderOrders();
  renderMessages();

  // URL param: ?section=calls|orders|messages
  const section = new URLSearchParams(location.search).get('section') || 'calls';
  switchTab(['calls','orders','messages'].includes(section) ? section : 'calls');
}

init();
</script>
</body>
</html>
