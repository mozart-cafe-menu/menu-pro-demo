<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Démo — Option Commande | GeNext</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0c0a08; font-family: 'Outfit', system-ui, sans-serif; }

    .demo-bar {
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 16px;
      background: rgba(12,10,8,0.98);
      border-bottom: 1px solid rgba(200,164,78,0.18);
      position: relative; z-index: 10;
    }
    .demo-bar-left { display: flex; align-items: center; gap: 10px; }
    .demo-bar-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 20px;
      background: rgba(200,164,78,0.12); border: 1px solid rgba(200,164,78,0.3);
      font-size: 0.72rem; letter-spacing: 0.08em; color: #c8a44e; font-weight: 500;
    }
    .demo-bar-badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #c8a44e; flex-shrink: 0;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .demo-bar-title {
      font-size: 0.82rem; color: rgba(244,234,210,0.7); font-weight: 300;
    }
    .demo-bar-title strong { color: rgba(244,234,210,0.95); font-weight: 500; }
    .demo-bar-right { display: flex; align-items: center; gap: 8px; }
    .demo-bar-link {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500;
      text-decoration: none; letter-spacing: 0.04em; transition: all 0.2s;
    }
    .demo-bar-link.outline {
      border: 1px solid rgba(200,164,78,0.35); color: rgba(244,234,210,0.75);
      background: transparent;
    }
    .demo-bar-link.outline:hover { border-color: #c8a44e; color: #f0ead8; background: rgba(200,164,78,0.08); }
    .demo-bar-link svg { flex-shrink: 0; }

    .demo-frame {
      width: 100%; height: calc(100svh - 44px);
      border: none; display: block;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="demo-bar">
    <div class="demo-bar-left">
      <span class="demo-bar-badge" id="d-badge">MODE DÉMO</span>
      <span class="demo-bar-title"><strong id="d-title">Option Commande</strong> <span id="d-sub">— Commande depuis la table</span></span>
    </div>
    <div class="demo-bar-right">
      <a href="demo-server.html?section=orders" target="_blank" class="demo-bar-link outline">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span id="d-app">App serveur</span>
      </a>
      <a href="/" class="demo-bar-link outline">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        <span id="d-back">Retour</span>
      </a>
    </div>
  </div>

  <script>
  /* Cette page suit la langue choisie sur le site (même clé localStorage que index.html) —
     avant ce correctif elle restait en français quelle que soit la langue du visiteur. */
  (function(){
    var T = {
      fr:{badge:'MODE DÉMO',    title:'Option Commande',    sub:'— Commande depuis la table',        app:'App serveur',          back:'Retour', doc:'Démo — Option Commande | GeNext'},
      en:{badge:'DEMO MODE',    title:'Table orders',       sub:'— Ordering straight from the table', app:'Server app',          back:'Back',   doc:'Demo — Table orders | GeNext'},
      el:{badge:'ΛΕΙΤΟΥΡΓΙΑ ΕΠΙΔΕΙΞΗΣ', title:'Παραγγελίες τραπεζιού', sub:'— Παραγγελία απευθείας από το τραπέζι', app:'Εφαρμογή σερβιτόρου', back:'Πίσω', doc:'Επίδειξη — Παραγγελίες τραπεζιού | GeNext'},
      es:{badge:'MODO DEMO',    title:'Pedidos de mesa',    sub:'— Pedido directamente desde la mesa', app:'App de camareros',   back:'Volver', doc:'Demo — Pedidos de mesa | GeNext'},
      de:{badge:'DEMO-MODUS',   title:'Tischbestellungen',  sub:'— Bestellung direkt vom Tisch',      app:'Server-App',          back:'Zurück', doc:'Demo — Tischbestellungen | GeNext'}
    };
    var l = 'fr';
    try { l = localStorage.getItem('mqr_lang') || 'fr'; } catch(e) {}
    var t = T[l] || T.fr;
    document.documentElement.lang = l;
    document.title = t.doc;
    var set = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
    set('d-badge', t.badge); set('d-title', t.title); set('d-sub', t.sub);
    set('d-app', t.app);     set('d-back', t.back);
  })();
  </script>

  <iframe
    class="demo-frame"
    src="menu-demo.html?demo_style=simple&demo_theme=gold-noir&demo_bell=0&demo_order=1"
    title="Démo Option Commande"
    allow="fullscreen"
  ></iframe>
</body>
</html>
